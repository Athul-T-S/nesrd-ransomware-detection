syntax = "proto3";
package nesrd;

message FileEvent {
  string process_name   = 1;
  string process_id     = 2;
  string operation      = 3;
  string file_path      = 4;
  string file_extension = 5;
  int64  bytes          = 6;
  int64  timestamp_ms   = 7;
}

message EventWindow {
  string agent_id              = 1;
  string session_id            = 2;
  string agent_ip              = 3;
  repeated FileEvent events    = 4;
}

message DetectionResult {
  string session_id      = 1;
  float  confidence      = 2;
  string decision        = 3;
  string mitre_technique = 4;
  string reason          = 5;
  int64  timestamp_ms    = 6;
  int32  process_id      = 7;
}
message Heartbeat {
  string agent_id     = 1;
  string agent_ip     = 2;
  int64  timestamp_ms = 3;
}

message HeartbeatAck {
  bool   acknowledged = 1;
  int64  timestamp_ms = 2;
}

service NESRDService {
  rpc StreamEvents(stream EventWindow) returns (stream DetectionResult);
  rpc SendHeartbeat(Heartbeat) returns (HeartbeatAck);
}